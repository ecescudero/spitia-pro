  activar: async function (code) {
    if (!PUSH_READY) return false;
    try {

      const reg = await navigator.serviceWorker.register("/firebase-messaging-sw.js");

const Actions = {
  addConserje: async (code, record) => {
    if (IS_LOCAL) {
      const current = DB.loadLocal();
      const updated = {
        ...current,
        conserjes: [...current.conserjes, record]
      };
      DB.saveLocal(updated);
      return;
    }
    await DB.putChild("conserjes", code, record);
  },
  patchConserje: async (appDataRef, code, partial) => {
    const updated = {
      ...appDataRef,
      conserjes: appDataRef.conserjes.map(c => c.id === code ? {
        ...c,
        ...partial
      } : c)
    };
    if (IS_LOCAL) {
      DB.saveLocal(updated);
    } else {
      await DB.patchChild("conserjes", code, partial);
    }
    return updated;
  },
  pushItem: async (appDataRef, collection, record) => {
    if (IS_LOCAL) {
      if (!record.id) record.id = Date.now();
      const updated = {
        ...appDataRef,
        [collection]: [record, ...appDataRef[collection]]
      };
      DB.saveLocal(updated);
      return updated;
    }
    const key = await DB.pushChild(collection, record);
    record.id = key;
    return {
      ...appDataRef,
      [collection]: [record, ...appDataRef[collection]]
    };
  },
  patchItem: async (appDataRef, collection, id, partial) => {
    const updated = {
      ...appDataRef,
      [collection]: appDataRef[collection].map(x => x.id === id ? {
        ...x,
        ...partial
      } : x)
    };
    if (IS_LOCAL) {
      DB.saveLocal(updated);
    } else {
      await DB.patchChild(collection, id, partial);
    }
    return updated;
  }
};

        fontSize: 19,
        fontWeight: 700,
        color: "white"
      }}>Spitia+</div>
              </div>
              <button onClick={onLogout} style={{
      background: "rgba(255,255,255,0.1)",
      border: "none",
      borderRadius: 8,
      padding: "6px 10px",
      color: "rgba(255,255,255,0.7)",
      cursor: "pointer",
      display: "flex",
      alignItems: "center",
      gap: 5,
      fontSize: 12.5
    }}>
                <LogOut size={14} /> Salir
              </button>
            </div>} nav={A_TABS.map(t => <NavBtn key={t.id} active={tab === t.id} label={t.label} Icon={t.Icon} badge={t.id === "avisos" ? avisosPendientes : 0} onClick={() => setTab(t.id)} />)}>
          {tab === "conserjes" && <A_Conserjes data={data} runAction={runAction} fire={fire} />}
          {tab === "avisos" && <A_Avisos data={data} runAction={runAction} fire={fire} />}
          {tab === "alertas" && <A_Alertas data={data} runAction={runAction} fire={fire} />}
          {tab === "anuncios" && <A_Anuncios data={data} runAction={runAction} fire={fire} />}
          {tab === "resumen" && <A_Resumen data={data} />}
          {toast && <Toast msg={toast} />}
        </AppShell>;
}
function App() {
  const [appData, setAppData] = useState({
    conserjes: [],
    avisos: [],
    alertas: [],
    anuncios: []
  });
  const [booting, setBooting] = useState(true);
  const [session, setSession] = useState(null);
  const [screen, setScreen] = useState("welcome");
  const [loginError, setLoginError] = useState("");
  const [loginLoading, setLoginLoading] = useState(false);
  const [justRegistered, setJustRegistered] = useState(null);
  const [retryingSession, setRetryingSession] = useState(false);
  useEffect(() => {
    setRetryingSession(false);
  }, [session && session.id]);
  useEffect(() => {
    const saved = Session.get();
    if (saved && saved.type === "conserje") {
      DB.loadForConserje(saved.id).then(data => {
        setAppData(data);
        setSession(saved);
        setBooting(false);
      });
    } else {
      setBooting(false);
    }
  }, []);
  useEffect(() => {
    if (!session) return;
    const tick = async () => {
      const data = session.type === "admin" ? await DB.loadAll() : await DB.loadForConserje(session.id);
      if (data) setAppData(data);
    };
    const id = setInterval(tick, 8000);
    return () => clearInterval(id);
  }, [session]);
  const handleRegister = async (nombre, sector, edificio, telefono, pin) => {
    setLoginLoading(true);
    try {
      const id = genCode();
      const nuevo = {
        id,
        nombre,
        sector,
        edificio,
        telefono,
        pin,
        activo: true,
        fechaAlta: fdate()
      };
      await Actions.addConserje(id, nuevo);
      const data = await DB.loadForConserje(id);
      setAppData(data);
      Session.set({
        type: "conserje",
        id
      });
      setJustRegistered({
        code: id,
        nombre,
        pin
      });
      setSession({
        type: "conserje",
        id
      });
    } catch (e) {
      alert(e.message || "No se pudo completar el alta. Comprueba tu conexión e inténtalo de nuevo.");
    }
    setLoginLoading(false);
  };
  const handleLogin = async payload => {
    setLoginLoading(true);
    setLoginError("");
    if (screen === "loginAdmin") {
      try {
        await Auth.signInAdmin(payload.email, payload.password);
        const data = await DB.loadAll();
        setAppData(data);
        setSession({
          type: "admin"
        });
      } catch (e) {
        setLoginError(e.message || "No se pudo iniciar sesión.");
      }
      setLoginLoading(false);
      return;
    }
    try {
      const record = await DB.fetchConserje(payload.code);
      if (record && record.activo && (!record.pin || record.pin === payload.pin)) {
        const data = await DB.loadForConserje(payload.code);
        setAppData(data);
        Session.set({
          type: "conserje",
          id: payload.code
        });
        setSession({
          type: "conserje",
          id: payload.code
        });
      } else {
        setLoginError("Código o PIN incorrectos.");
      }
    } catch (e) {
      setLoginError(`No se pudo comprobar el código. Contacta con ${KN.agente}.`);
    }
    setLoginLoading(false);
  };
  const handleLogout = () => {
    Auth.signOut();
    Session.clear();
    setSession(null);
    setScreen("welcome");
    setJustRegistered(null);
  };
  const addAviso = async (tipo, dir, notas) => {
    const aviso = {
      conserjeId: session.id,
      tipo,
      dir,
      notas,
      estado: "pendiente",
      importe: null,
      validado: false,
      fecha: fdate()
    };
    try {
      const updated = await Actions.pushItem(appData, "avisos", aviso);
      setAppData(updated);
    } catch (e) {
      alert(e.message || "No se pudo registrar el aviso. Comprueba tu conexión e inténtalo de nuevo.");
    }
  };
  const solicitarBajaDatos = async () => {
    try {
      const updated = await Actions.patchConserje(appData, session.id, {
        bajaSolicitada: true,
        fechaBaja: fdate()
      });
      setAppData(updated);
    } catch (e) {
      alert(e.message || "No se pudo enviar la solicitud. Inténtalo de nuevo.");
      return;
    }
    handleLogout();
  };
  const runAction = async fn => {
    try {
      const updated = await fn(appData);
      setAppData(updated);
    } catch (e) {
      alert(e.message || "No se pudo guardar. Si ha pasado un rato, cierra sesión y vuelve a entrar como admin.");
    }
  };
  if (booting) {
    return <div style={{
      maxWidth: 440,
      margin: "0 auto",
      height: "100vh",
      background: C.navy,
      display: "flex",
      alignItems: "center",
      justifyContent: "center"
    }}>
            <div style={{
        textAlign: "center",
        color: "white"
      }}>
              <div style={{
          fontSize: 36.5,
          marginBottom: 14
        }}>🔑</div>
              <div style={{
          fontSize: 14.5,
          opacity: 0.5
        }}>Cargando...</div>
            </div>
          </div>;
  }
  if (!session) {
    if (screen === "welcome") return <WelcomeScreen onGoRegister={() => setScreen("register")} onGoLogin={() => {
      setLoginError("");
      setScreen("login");
    }} onGoAdmin={() => {
      setLoginError("");
      setScreen("loginAdmin");
    }} />;
    if (screen === "register") return <RegisterScreen onBack={() => setScreen("welcome")} onSubmit={handleRegister} loading={loginLoading} />;
    if (screen === "login") return <LoginScreen onBack={() => setScreen("welcome")} onLogin={handleLogin} error={loginError} loading={loginLoading} isAdmin={false} />;
    if (screen === "loginAdmin") return <LoginScreen onBack={() => setScreen("welcome")} onLogin={handleLogin} error={loginError} loading={loginLoading} isAdmin={true} />;
    return <WelcomeScreen onGoRegister={() => setScreen("register")} onGoLogin={() => setScreen("login")} onGoAdmin={() => setScreen("loginAdmin")} />;
  }
  if (session.type === "admin") return <AdminApp data={appData} runAction={runAction} onLogout={handleLogout} />;
  const conserje = appData.conserjes.find(c => c.id === session.id);
  if (!conserje) {
    if (!retryingSession) {
      setRetryingSession(true);
      DB.loadForConserje(session.id).then(fresh => setAppData(fresh));
      return <div style={{
        maxWidth: 440,
        margin: "0 auto",
        height: "100vh",
        background: C.navy,
        display: "flex",
        alignItems: "center",
        justifyContent: "center"
      }}>
              <div style={{
          textAlign: "center",
          color: "white"
        }}>
                <div style={{
            fontSize: 36.5,
            marginBottom: 14
          }}>🔑</div>
                <div style={{
            fontSize: 14.5,
            opacity: 0.5
          }}>Comprobando tu sesión...</div>
              </div>
            </div>;
    }
    handleLogout();
    return null;
  }
  const misAvisos = appData.avisos.filter(a => a.conserjeId === session.id);
  return <ConserjeApp conserje={conserje} avisos={misAvisos} alertas={appData.alertas} anuncios={appData.anuncios} onAddAviso={addAviso} onLogout={handleLogout} onSolicitarBaja={solicitarBajaDatos} justRegistered={justRegistered} onDismissWelcome={() => setJustRegistered(null)} />;
}
console.log("%c⚠️ ESTO ES EL ENTORNO DE PRUEBAS — Spitia+ TEST build 2026-09-24-b", "color:#C0392B;font-weight:bold;font-size:14px");
ReactDOM.createRoot(document.getElementById("root")).render(<App />);</script>
</body>
</html>
